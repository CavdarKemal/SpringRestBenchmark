# ============================================================================
#  SpringRestBenchmark — lokale Infrastruktur
# ============================================================================
#  Startet ein PostgreSQL fuer die Benchmarks. Bewusst schlank gehalten, damit
#  Studenten mit einem Befehl loslegen koennen:
#
#      docker compose -f infra/docker-compose.yml up -d
#
#  Die Zugangsdaten entsprechen den Defaults in server/src/main/resources/application.yml.
# ============================================================================

services:
  postgres:
    image: postgres:16
    container_name: benchmark-postgres
    environment:
      POSTGRES_DB: benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
    ports:
      - "5432:5432"
    volumes:
      - benchmark-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d benchmark"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Etwas mehr Ressourcen fuer aussagekraeftige Durchsatz-Messungen.
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"

volumes:
  benchmark-pgdata:
